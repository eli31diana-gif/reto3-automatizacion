name: CI/CD - Cucumber + Playwright

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Usar Node 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Instalar Playwright con navegadores
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5️⃣ Correr tests de Cucumber y generar reporte JSON
      - name: Run Cucumber tests
        run: npx cucumber-js --format json:cucumber-report.json

      # 6️⃣ Subir reporte JSON como evidencia
      - name: Upload Cucumber JSON report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.json

      # 7️⃣ (Opcional) Generar HTML a partir del JSON
      - name: Generate HTML report
        run: npx cucumber-html-reporter --input cucumber-report.json --output cucumber-report.html --theme bootstrap

      # 8️⃣ Subir reporte HTML
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: cucumber-report.html
